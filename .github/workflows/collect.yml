name: collect

on:
  schedule:
    # 21:17 UTC = 06:17 KST (다음 날). 정각을 피해 지연 확률을 낮춥니다.
    - cron: "17 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect snapshots
        env:
          # robots.txt 예의: User-Agent에 실을 연락 경로
          TRACKER_CONTACT: https://monkeeper.com/
          # 공공데이터포털 인증키. 저장소 Settings > Secrets에 등록하세요.
          # 미설정이면 api 타입 대상만 건너뛰고 web 수집은 정상 진행됩니다.
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python collect.py

      - name: Commit changes
        run: |
          git config user.name  "monkeeper-tracker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            CHANGED=$(git diff --staged --name-only -- events | wc -l | tr -d ' ')
            git commit -m "collect $(date -u +%Y-%m-%d): 변동 ${CHANGED}건"
            git push
          fi
